services:
  - type: web
    name: taskmaster-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: TASKMASTER_ALLOWED_ORIGINS
        value: http://localhost:5500,http://127.0.0.1:5500,https://almenaradulcino-ai.github.io
      - key: DATABASE_URL
        sync: false
